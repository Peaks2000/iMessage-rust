[package]
name = "linux-imessage"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Experimental Linux iMessage client, server, and protocol engine"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:eframe"]

[[bin]]
name = "messages"
path = "src/bin/messages.rs"
required-features = ["desktop"]

[[bin]]
name = "messages-server"
path = "src/bin/messages-server.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"], optional = true }
flate2 = "1"
fs2 = "0.4"
keyring = { version = "3.6.3", features = ["async-secret-service", "crypto-rust", "async-io"] }
libloading = "0.8"
openssl = "0.10"
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "cookies"] }
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
