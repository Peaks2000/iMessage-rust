[package]
name = "linux-imessage"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Experimental Linux iMessage client, server, and protocol engine"
publish = false

[features]
default = ["desktop"]
desktop = [
    "dep:arboard", "dep:eframe", "dep:fdk-aac-sys", "dep:heic-rs", "dep:image", "dep:linkify",
    "dep:phonenumber", "dep:raw-window-handle", "dep:roxmltree",
    "dep:smithay-client-toolkit", "dep:wayland-client", "dep:winit",
]

[[bin]]
name = "messages"
path = "src/bin/messages.rs"
required-features = ["desktop"]

[[bin]]
name = "messages-server"
path = "src/bin/messages-server.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.7", optional = true }
argon2 = "0.5"
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
compcol = { version = "0.7.3", default-features = false, features = ["qpack"] }
directories = "6"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"], optional = true }
fdk-aac-sys = { version = "0.5", optional = true }
flate2 = "1"
foreign-types = "0.3"
fs2 = "0.4"
futures-util = "0.3"
heic-rs = { version = "0.1.4", default-features = false, features = ["std"], optional = true }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"], optional = true }
keyring = { version = "3.6.3", features = ["async-secret-service", "crypto-rust", "async-io"] }
libloading = "0.8"
libc = "0.2"
linkify = { version = "0.11", optional = true }
openssl = "0.10"
openssl-sys = "0.9"
phonenumber = { version = "0.3.10", optional = true }
plist = "1"
prost = "0.14"
quick-xml = "0.38"
raw-window-handle = { version = "0.6", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "cookies", "stream"] }
roxmltree = { version = "0.21", default-features = false, features = ["std"], optional = true }
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.20", default-features = false, optional = true }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
wayland-client = { version = "0.31", features = ["system", "dlopen"], optional = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"], optional = true }
zeroize = { version = "1", features = ["derive", "serde"] }
